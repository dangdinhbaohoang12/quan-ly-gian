name: Kiểm tra bảo mật với zizmor
 
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
 
jobs:
  zizmor:
    name: Quét GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write 
 
    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 
      - name: Cài đặt và Chạy zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: ".github/workflows/"
          min-severity: "high"
          advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
 
