name: Kiểm tra bảo mật với zizmor
 
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
 
jobs:
  zizmor:
    name: Quét GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write 
 
    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 
      - name: Cài đặt và Chạy zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: ".github/workflows/"
          min-severity: "high"
          advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
 
